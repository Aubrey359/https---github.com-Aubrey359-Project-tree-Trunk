<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social Media Input</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .social-input {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .social-input i {
      width: 30px;
      font-size: 20px;
      color: #333;
    }
    .social-input input {
      padding: 10px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
    }
  </style>
</head>
<body>

  <h2>Social Media Links</h2>

  <div class="social-input">
    <i class="fab fa-facebook-f"></i>
    <input type="url" placeholder="Facebook profile link">
  </div>

  <div class="social-input">
    <i class="fab fa-twitter"></i>
    <input type="url" placeholder="Twitter profile link">
  </div>

  <div class="social-input">
    <i class="fab fa-instagram"></i>
    <input type="url" placeholder="Instagram profile link">
  </div>

  <div class="social-input">
    <i class="fab fa-tiktok"></i>
    <input type="url" placeholder="TikTok profile link">
  </div>

</body>
</html>
