<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="container">
    <h1>Lemook Gardens</h1>
    <nav>
      <a href="about.html">About</a>
      <a href="menu.html">Menu</a>
      <a href="drinks.html">Drinks</a>
      <a href="bnb.html">BnB</a>
      <a href="booking.html" class="active">Booking</a>
      <a href="contact.html">Contact</a>
      <a href="gallery.html" class="gallery-link">Gallery</a>
    </nav>
  </header>
  <section id="booking" class="section container">
    <h2>Make a Reservation</h2>
    <p>Fill out the form below to book your table or BnB stay. We will confirm your reservation as soon as possible.</p>
    <form class="booking-form" action="#" method="POST">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <input type="tel" name="phone" placeholder="Your Phone" required>
      <input type="date" name="date" required>
      <input type="time" name="time" required>
      <textarea name="message" placeholder="Message or Special Request"></textarea>
      <button type="submit">Book Now</button>
    </form>
  </section>
  <footer>
    <p>&copy; 2025 Lemook Gardens. All rights reserved.</p>
  </footer>
</body>
